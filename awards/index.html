<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
	<meta name="robots" content="noindex">
  <title>Better U Crew - Cuzzie Awards</title>


	<style>
	  /* ==============================		 Base Page		 ============================== */

	  body {
		font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
		padding: 20px;
		/* Option 1: Using a image file */
		  background: url(https://st.depositphotos.com/1692993/4351/i/450/depositphotos_43519371-stock-photo-red-velvet-curtain-with-texture.jpg) no-repeat center center fixed; 
		  background-size: cover;
		/* background: #f4f4f9; */
		color: #444;
	  }

	  .header {
		text-align: center;
		margin-bottom: 25px;
		color: #fff;
	  }

	  .intro-text {
		max-width: 1200px;
		margin: 10px auto;
		line-height: 1.5;
		color: #fff;
	  }


	  /* ==============================		 Main Layout		 ============================== */

	  .container {
		display: flex;
		gap: 20px;
		max-width: 1200px;
		margin: auto;
		height: 80vh;
	  }


	  /* ==============================		 Nominee Sidebar		 ============================== */

	  .sidebar {
		width: 30%;
		background: #fff;
		padding: 20px;
		border-radius: 8px;
		box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
		display: flex;
		flex-direction: column;
	  }

	  .sidebar-instruction {
		font-size: 12px;
		color: #444;
		margin-top: -5px;
	  }

	  #staff-list {
		overflow-y: auto;
		padding-right: 10px;
		flex-grow: 1;
        min-height: 150px;
        border: 2px dashed transparent;
        border-radius: 6px;
        transition: all 0.2s ease;
	  }

      #staff-list.drag-over {
        border-color: #d4af37;
        background-color: #fffdf0;
      }


	  /* ==============================		 Awards Grid		 ============================== */

	  .awards {
		width: 70%;
		background: #fff;
		padding: 20px;
		border-radius: 8px;
		box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
		display: grid;
		grid-template-columns: 1fr 1fr;
		gap: 15px;
		overflow-y: auto;
		max-height: 100%;
	  }

	  .award-card {
		background: #fafafa;
		border: 1px solid #e0e0e0;
		border-radius: 6px;
		padding: 12px;
	  }

	  .award-card h4 {
		margin: 0 0 8px 0;
		font-size: 15px;
		color: #960019;
	  }

	  .award-description {
		font-size: 11px;
		color: #444;
		margin: 2px 0 6px 0;
	  }


	  /* ==============================		 Drag & Drop		 ============================== */

	  .draggable {
		padding: 10px;
		margin: 6px 0;
		background: #f0f0f0;
		border: 1px solid #ccc;
		border-radius: 4px;
		cursor: grab;
		user-select: none;
		font-weight: 500;
	  }

	  .draggable.disabled {
		opacity: 0.3;
		cursor: not-allowed;
		background: #e0e0e0;
		text-decoration: line-through;
	  }

	  .drop-zone {
		border: 2px dashed #bbb;
		min-height: 42px;
		border-radius: 4px;
		padding: 5px;
		background: #fff;
		display: flex;
		align-items: center;
		justify-content: center;
	  }

	  .drop-zone.filled {
		border-color: #960019;
		background: #fff5f5;
		border-style: solid;
	  }

	  .drop-zone .draggable {
		margin: 0;
		width: 100%;
		text-align: center;
		background: #960019;
		color: white;
		border: none;
	  }


	  /* ==============================		 Scrollbars		 ============================== */

	  #staff-list::-webkit-scrollbar,
	  .awards::-webkit-scrollbar {
		width: 6px;
	  }

	  #staff-list::-webkit-scrollbar-thumb,
	  .awards::-webkit-scrollbar-thumb {
		background-color: #ccc;
		border-radius: 4px;
	  }


	  /* ==============================		 Submit Button		 ============================== */

	  .submit-wrapper {
		text-align: center;
	  }

	  .submit-btn {
		background: #960019;
		color: white;
		border: 2px solid #fff;
		padding: 12px 28px;
		border-radius: 6px;
		cursor: pointer;
		font-size: 16px;
		font-weight: bold;
		margin-top: 25px;
	  }

	  .submit-btn:hover {
		background: #700013;
	  }


	  /* ==============================		 Backup Modal		 ============================== */

	  .modal {
		display: none;
		position: fixed;
		top: 0;
		left: 0;
		width: 100%;
		height: 100%;
		background: rgba(0, 0, 0, 0.6);
		align-items: center;
		justify-content: center;
	  }

	  .modal-content {
		background: #fff;
		padding: 25px;
		border-radius: 8px;
		max-width: 500px;
		width: 90%;
		text-align: center;
	  }

	  .modal-divider {
		border: 0;
		border-top: 1px solid #eee;
		margin: 15px 0;
	  }

	  .modal-description {
		font-size: 14px;
		color: #666;
	  }

	  .report-box {
		width: 100%;
		height: 120px;
		margin: 15px 0;
		padding: 10px;
		font-family: monospace;
		font-size: 13px;
		box-sizing: border-box;
	  }

	  .secondary-btn {
